<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK8DX YONOKOのNITA</title>
<meta name="description" content="マリオカート8DX の NITA（150cc、Meta Only）96 コースの自己ベストと WR の差">
<!-- 見る人の端末に Noto Sans JP が入っていなくても同じ字になるよう、Google Fonts から読み込む -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap">
<link rel="stylesheet" href="galaxy.css?v=9263f77ccf">
</head>
<body>
<div class="page">
  <header class="top">
    <div class="titles">
      <h1 class="title">MK8DX&nbsp; YONOKOのNITA</h1>
      <p class="lead">150cc ／ Meta Only（VSカスタムのみ）　WR の出典：<a class="source" target="_blank" rel="noopener">MK8DX NITA</a></p>
    </div>
    <p class="stamp num" id="updated"></p>
  </header>

  <section class="boxes" id="summary"></section>
  <section class="legend" id="legend"></section>
  <section class="filters" id="filters"></section>
  <section class="table" id="table"></section>

  <footer class="notes">
    WR の出典：<a class="source" target="_blank" rel="noopener">MK8DX NITA</a>（150cc、Meta Only / VSカスタムのみ）<br>
    WR 更新日は、実際に記録が出た日とは異なる場合があります。<br>
    コースを押すと、自己ベスト更新の履歴が開きます。
  </footer>
</div>

<script src="common.js?v=099a6b9de9"></script>
<script>
// 公開ページ（見るだけ）。中身は同じフォルダの data.json（mk8dx-nita のアプリが書き出す）。
// 見た目は galaxy.css、表を作る処理は common.js（管理画面と共有）。
let state = null;
const view = NITA.newView();

async function load() {
  try {
    // 更新したばかりの記録が出るよう、古い写しを使わない
    state = await (await fetch("data.json?t=" + Date.now(), { cache: "no-store" })).json();
  } catch (e) {
    document.getElementById("table").innerHTML = '<div class="empty">記録を読み込めませんでした。少し待ってから開き直してください。</div>';
    return;
  }
  document.querySelectorAll("a.source").forEach((a) => a.href = state.source_url);
  render();
}

function render() {
  const parts = [
    () => { document.getElementById("updated").innerHTML = `<span class="dot">●</span> 最終更新　${NITA.esc(NITA.fmtDate(state.updated_at))}`; },
    () => { document.getElementById("summary").innerHTML = NITA.summaryHtml(state); },
    () => { document.getElementById("legend").innerHTML = NITA.legendHtml(state); },
    renderTable,
  ];
  for (const part of parts) {
    try { part(); } catch (e) { console.error(e); }  // 1 か所の失敗で全部が消えないように
  }
}

function renderTable() {
  NITA.renderFilters(document.getElementById("filters"), state, view, renderTable);
  const box = document.getElementById("table");
  box.innerHTML = NITA.headHtml(view) + NITA.rowsHtml(state, view, { detail: (c) => NITA.historyHtml(c) });
  NITA.bindHead(box, view, renderTable);
  box.querySelectorAll(".row").forEach((row) => row.onclick = () => {
    view.openAbbr = view.openAbbr === row.dataset.abbr ? null : row.dataset.abbr;
    renderTable();
  });
}

load();
</script>
</body>
</html>
